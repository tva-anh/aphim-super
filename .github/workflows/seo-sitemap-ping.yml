name: Daily SEO Sitemap & Google Indexing Ping

on:
  schedule:
    # Chạy tự động mỗi ngày lúc 2h sáng (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công bất cứ lúc nào

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google & Bing for aphim.store sitemaps
        run: |
          echo "🚀 Đang gửi thông báo Sitemap mới tới Google và Bing..."
          
          # 1. Warm-up sitemap cache trên website
          curl -s -L "https://aphim.store/sitemap.xml" > /dev/null || true
          curl -s -L "https://aphim.store/sitemap-images.xml" > /dev/null || true
          
          # 2. Ping Google Sitemaps
          curl -s -L "https://www.google.com/ping?sitemap=https%3A%2F%2Faphim.store%2Fsitemap.xml" || true
          curl -s -L "https://www.google.com/ping?sitemap=https%3A%2F%2Faphim.store%2Fsitemap-images.xml" || true
          
          # 3. Ping Bing / IndexNow
          curl -s -L "https://www.bing.com/ping?sitemap=https%3A%2F%2Faphim.store%2Fsitemap.xml" || true
          
          echo "✅ Đã gửi tín hiệu thu thập dữ liệu Sitemap hàng ngày thành công cho https://aphim.store!"
