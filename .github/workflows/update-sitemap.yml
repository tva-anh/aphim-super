name: Auto Update Comprehensive Sitemap & Search Engine Ping

on:
  schedule:
    - cron: '17 2 * * *'   # Chạy tự động mỗi ngày lúc 2:17 AM UTC (9:17 AM giờ VN)
  workflow_dispatch:       # Cho phép bấm chạy thủ công bất cứ lúc nào từ GitHub Actions tab

# Cấp quyền write để bot có thể tự động commit và push sitemap mới lên repo
permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install axios

      - name: Generate high-capacity sitemaps (25,000+ Clean URLs)
        run: node generate-sitemap.js

      - name: Commit & push if sitemap changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-images.xml public/sitemap.xml public/sitemap-images.xml
          git diff --staged --quiet || git commit -m "chore(seo): auto-update high-capacity sitemaps [$(date +'%Y-%m-%d')] [skip ci]"
          git push

      - name: Submit to IndexNow Protocol (Bing, Yandex, Seznam)
        run: |
          echo "⚡ Đang gửi thông báo IndexNow..."
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"aphim.store","key":"e7b92f4c19a8451187491cf02b9365c1","keyLocation":"https://aphim.store/e7b92f4c19a8451187491cf02b9365c1.txt","urlList":["https://aphim.store/","https://aphim.store/sitemap.xml","https://aphim.store/sitemap-images.xml","https://aphim.store/danh-sach","https://aphim.store/categories"]}' || true
          echo "✅ Đã kích hoạt IndexNow thành công!"

      - name: Ping Search Engines (Google & Bing)
        run: |
          echo "📢 Đang ping Google & Bing với bộ sitemap mới..."
          curl -s -L "https://www.google.com/ping?sitemap=https%3A%2F%2Faphim.store%2Fsitemap.xml" || true
          curl -s -L "https://www.google.com/ping?sitemap=https%3A%2F%2Faphim.store%2Fsitemap-images.xml" || true
          curl -s -L "https://www.bing.com/ping?sitemap=https%3A%2F%2Faphim.store%2Fsitemap.xml" || true
          curl -s -L "https://www.bing.com/ping?sitemap=https%3A%2F%2Faphim.store%2Fsitemap-images.xml" || true
          echo "✅ Đã thông báo tới Google và Bing thành công!"
