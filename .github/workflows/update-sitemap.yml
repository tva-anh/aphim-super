name: Auto Update Comprehensive Sitemap & Search Engine Ping

on:
  schedule:
    - cron: '0 2,14 * * *'   # Chạy tự động 2 lần/ngày lúc 9:00 AM và 21:00 PM giờ VN
  workflow_dispatch:         # Cho phép bấm chạy thủ công bất cứ lúc nào từ GitHub Actions tab

# Cấp quyền write để bot có thể tự động commit và push sitemap mới lên repo
permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install axios

      - name: Generate high-capacity sitemaps & Push IndexNow (25,000+ Clean URLs)
        run: node generate-sitemap.js

      - name: Commit & push if sitemap changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml sitemap-images.xml public/sitemap.xml public/sitemap-images.xml
          git diff --staged --quiet || git commit -m "chore(seo): auto-update high-capacity sitemaps [$(date +'%Y-%m-%d')] [skip ci]"
          git push

      - name: Ping Search Engines (Google & Bing Warmup)
        run: |
          echo "📢 Đang gửi tín hiệu nạp sitemap tới aphim.store..."
          curl -s -L "https://aphim.store/sitemap.xml" > /dev/null || true
          curl -s -L "https://aphim.store/sitemap-images.xml" > /dev/null || true
          curl -s -L "https://aphim.store/sitemap-movies.xml" > /dev/null || true
          curl -s -L "https://aphim.store/sitemap-categories.xml" > /dev/null || true
          echo "✅ Đã nạp sitemap thành công!"
