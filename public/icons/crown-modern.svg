<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="vipCrownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFE082"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="vipCrownShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="vipCrownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#vipCrownGlow)">
    <!-- Crown Base & Body -->
    <path d="M2.5 6.5L6.5 16H17.5L21.5 6.5L15.5 11.5L12 4L8.5 11.5L2.5 6.5Z" 
          fill="url(#vipCrownGold)" 
          stroke="#945800" 
          stroke-width="0.75" 
          stroke-linejoin="round"/>
    <!-- Specular Highlight Overlay -->
    <path d="M3.6 7.5L6.8 15H17.2L20.4 7.5L15.4 11.7L12 4.8L8.6 11.7L3.6 7.5Z" 
          fill="url(#vipCrownShine)" 
          opacity="0.5"/>
    <!-- Crown Bottom Rim -->
    <rect x="5.5" y="17.5" width="13" height="3" rx="1.5" 
          fill="url(#vipCrownGold)" 
          stroke="#945800" 
          stroke-width="0.75"/>
    <!-- Jewels on Peaks -->
    <circle cx="12" cy="3.8" r="1.5" fill="#FFFFFF" stroke="#FF8F00" stroke-width="0.75"/>
    <circle cx="2.5" cy="6.2" r="1.3" fill="#FFFFFF" stroke="#FF8F00" stroke-width="0.75"/>
    <circle cx="21.5" cy="6.2" r="1.3" fill="#FFFFFF" stroke="#FF8F00" stroke-width="0.75"/>
    <!-- Gemstones on Rim -->
    <circle cx="12" cy="19" r="1" fill="#E11D48"/>
    <circle cx="8.5" cy="19" r="0.8" fill="#0284C7"/>
    <circle cx="15.5" cy="19" r="0.8" fill="#0284C7"/>
  </g>
</svg>
