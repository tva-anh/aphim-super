  <polygon points="23,1.5 25.5,5 23,8.5 20.5,5" fill="url(#rubyGemGrad)" stroke="#FFF" stroke-width="0.7"/>
  <circle cx="22.2" cy="4" r="0.8" fill="#FFF" opacity="0.9"/>
  <polygon points="9,8 10.8,11 9,14 7.2,11" fill="url(#sapphireGemGrad)" stroke="#FFF" stroke-width="0.6"/>
  <polygon points="37,8 38.8,11 37,14 35.2,11" fill="url(#sapphireGemGrad)" stroke="#FFF" stroke-width="0.6"/>
  <circle cx="16" cy="19.5" r="1.3" fill="#FFFBEB" stroke="#D97706" stroke-width="0.7"/>
  <circle cx="30" cy="19.5" r="1.3" fill="#FFFBEB" stroke="#D97706" stroke-width="0.7"/>
  <!-- Sparkle Flare on Top -->
  <path d="M28 2L29 4.5L31.5 5.5L29 6.5L28 9L27 6.5L24.5 5.5L27 4.5L28 2Z" fill="#FFF" opacity="0.85"/>
