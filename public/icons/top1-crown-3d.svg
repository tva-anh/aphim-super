  <path d="M23 5L16 20L23 27L30 20L23 5Z" fill="url(#goldSpecular)"/>
  <path d="M9 11L16 20L11 28L5 29L9 11Z" fill="#B45309" fill-opacity="0.4"/>
  <path d="M37 11L30 20L35 28L41 29L37 11Z" fill="#B45309" fill-opacity="0.4"/>
  <!-- Lower Gem Plate -->
  <rect x="8" y="27" width="30" height="4" rx="2" fill="url(#crownRim3D)" stroke="#78350F" stroke-width="0.8"/>
  <!-- Crown Rim Cut Gems -->
  <circle cx="14" cy="29" r="1.3" fill="url(#sapphireGemGrad)"/>
  <circle cx="23" cy="29" r="1.8" fill="url(#rubyGemGrad)"/>
  <circle cx="32" cy="29" r="1.3" fill="url(#sapphireGemGrad)"/>
