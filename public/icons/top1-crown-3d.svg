  <!-- Base Rim Shadow -->
  <path d="M7 29C15 31.5 31 31.5 39 29V32C31 34.5 15 34.5 7 32V29Z" fill="url(#crownRim3D)" stroke="#5A2E05" stroke-width="0.8"/>
