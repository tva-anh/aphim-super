  <text x="18" y="23.5" font-size="16" font-weight="900" font-family="'Outfit', system-ui, -apple-system, sans-serif" text-anchor="middle" fill="url(#bronzeNum3D)" style="filter:drop-shadow(0 1px 0 rgba(254,215,170,0.85)); letter-spacing:-0.5px;">3</text>
