<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bronzeRim3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="75%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="bronzeCore3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="40%" stop-color="#FDBA74"/>
      <stop offset="80%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="bronzeNum3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#270901"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="bronzeSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Outer Beveled Bronze Ring -->
  <circle cx="18" cy="18" r="16.5" fill="url(#bronzeRim3D)" stroke="#270901" stroke-width="1"/>
