  <circle cx="18" cy="18" r="14.5" fill="none" stroke="#FFEDD5" stroke-width="1.2" opacity="0.9"/>
  <!-- Inner Polished Warm Bronze Core -->
  <circle cx="18" cy="18" r="12.5" fill="url(#bronzeCore3D)" stroke="#7C2D12" stroke-width="0.8"/>
