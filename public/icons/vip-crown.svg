<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="crownGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="crownRubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="crownCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="crownShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#crownShine)">
    <!-- Crown Base Band -->
    <path d="M4 17.5C4 17.2 4.2 17 4.5 17H19.5C19.8 17 20 17.2 20 17.5V19.5C20 20.3 19.3 21 18.5 21H5.5C4.7 21 4 20.3 4 19.5V17.5Z" fill="url(#crownGoldGrad)"/>
    <!-- Crown Spikes -->
    <path d="M3.2 7.8L7.5 13.5L12 4.5L16.5 13.5L20.8 7.8L19.5 17.5H4.5L3.2 7.8Z" fill="url(#crownGoldGrad)"/>
    <!-- Pearl / Diamond Tips -->
    <circle cx="12" cy="4.2" r="1.6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.6"/>
    <circle cx="3.2" cy="7.6" r="1.3" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.5"/>
    <circle cx="20.8" cy="7.6" r="1.3" fill="#FFFFFF" stroke="#F59E0B" stroke-width="0.5"/>
    <!-- Embedded Gemstones -->
    <polygon points="12,17.6 13.4,19.1 12,20.6 10.6,19.1" fill="url(#crownRubyGrad)"/>
    <circle cx="7.2" cy="19.1" r="1.1" fill="url(#crownCyanGrad)"/>
    <circle cx="16.8" cy="19.1" r="1.1" fill="url(#crownCyanGrad)"/>
  </g>
</svg>
